name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    name: 单元测试 · Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查（用户脚本）
        run: node --check bili-subtitle.user.js
      - name: 单元测试
        run: node tests/run-tests.js
      - name: 候选评分 / 转写质量测试（19 项）
        run: node tests/test-scorer.js
      - name: 接线验证测试（95 项：模块有定义还必须有调用方，UI 元素两侧都要在）
        run: node tests/test-wiring.js
      - name: 路由身份与导出动作测试（25 条：锚点不误伤 / 换 P 必换 / 反向断言防回潮）
        run: node tests/test-route.js
      - name: 文档一致性门禁（版本号 / 测试数不得漂移）
        run: node tests/check-docs.js
