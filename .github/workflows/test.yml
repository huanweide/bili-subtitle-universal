name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    name: 单元测试 · Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查（用户脚本）
        run: node --check bili-subtitle.user.js
      - name: 单元测试
        run: node tests/run-tests.js
      - name: 文档一致性门禁（版本号 / 测试数不得漂移）
        run: node tests/check-docs.js
